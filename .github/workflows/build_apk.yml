name: Build APK Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kode
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Siapkan Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Buat Cangkang Android Otomatis
        run: flutter create . --platforms=android

      - name: Suntik Izin Akses Internet
        run: |
          sed -i 's/<application/    <uses-permission android:name="android.permission.INTERNET"\/>\n    <application/g' android/app/src/main/AndroidManifest.xml

      - name: Download Library
        run: flutter pub get

      - name: Mulai Bikin APK
        run: flutter build apk --release

      - name: Simpan APK ke GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Aplikasi-Wahidiyah-APK
          path: build/app/outputs/flutter-apk/app-release.apk
